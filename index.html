<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>云端会客厅 · 临时聊天室</title>
<meta name="description" content="一念聚散的云端聊天室：临时身份、口令入房、房主离开即散场。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>⛩️</text></svg>">
<style>
:root{
  --bg:#0a0d18; --bg2:#111627; --card:#161c30; --card2:#1c2440;
  --line:#2a3352; --ink:#eef1fb; --ink2:#a7b0cc; --ink3:#6b7699;
  --gold:#e3b45c; --gold2:#f3d089; --red:#d85040; --teal:#3fbfae;
  --radius:16px;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1100px 600px at 85% -10%, rgba(224,120,70,.14), transparent 60%),
    radial-gradient(900px 500px at 10% 0%, rgba(120,140,255,.12), transparent 55%),
    var(--bg);
  color:var(--ink);line-height:1.6;min-height:100dvh;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("assets/monkey.jpg");
  background-size:cover;background-position:center top;opacity:.10;filter:saturate(1.1);
}
#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}

/* ============ 通用 ============ */
.view{display:none;flex:1;flex-direction:column}
.view.on{display:flex}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:0 20px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:13px;border:1px solid transparent;cursor:pointer;
  font-size:15px;font-weight:650;font-family:inherit;transition:.2s ease;color:var(--ink);
  background:var(--card2);border-color:var(--line);
}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:linear-gradient(180deg,#f0c060,#d99f3a);color:#2b1a05;border-color:#b98830;box-shadow:0 8px 24px -10px rgba(227,180,92,.6)}
.btn.gold:hover{box-shadow:0 12px 30px -10px rgba(227,180,92,.8)}
.btn.red{background:linear-gradient(180deg,#e05a48,#c23b2e);color:#fff;border-color:#a53024}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.input{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:rgba(10,14,26,.75);color:var(--ink);font-size:15px;font-family:inherit;outline:none;transition:.2s;
}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,180,92,.15)}
.input::placeholder{color:var(--ink3)}
.title{font-weight:750;letter-spacing:.02em}
.muted{color:var(--ink2);font-size:13.5px}
.tiny{color:var(--ink3);font-size:12px}

/* ============ 入场 ============ */
#view-enter{align-items:center;justify-content:center;padding:40px 20px}
.enter-card{
  width:100%;max-width:420px;background:linear-gradient(180deg,rgba(28,36,64,.92),rgba(16,20,38,.92));
  border:1px solid var(--line);border-radius:22px;padding:34px 30px;text-align:center;
  box-shadow:var(--shadow);backdrop-filter:blur(8px);
}
.avatar-big{
  width:108px;height:108px;border-radius:50%;overflow:hidden;margin:0 auto 6px;
  border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(227,180,92,.15),0 14px 34px -12px rgba(0,0,0,.8);
  position:relative;
}
.avatar-big img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.id-name{font-size:26px;font-weight:800;margin-top:14px;letter-spacing:.04em}
.id-name .accent{color:var(--gold2)}
.enter-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.enter-note{margin-top:20px;font-size:12.5px;color:var(--ink3);line-height:1.8}

/* ============ 大厅 ============ */
header.bar{
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
  background:rgba(10,13,24,.82);border-bottom:1px solid var(--line);
}
.bar-in{display:flex;align-items:center;gap:12px;padding:13px 20px;max-width:760px;margin:0 auto}
.bar .me{display:flex;align-items:center;gap:9px;min-width:0}
.bar .me img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid var(--gold)}
.bar .me .n{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.logo{font-size:17px;font-weight:800;letter-spacing:.06em;color:var(--gold2);white-space:nowrap}
.logo small{color:var(--ink3);font-weight:500;font-size:11px;margin-left:6px;letter-spacing:.1em}
.spacer{flex:1}

.hero{
  border-radius:20px;overflow:hidden;position:relative;margin-top:22px;
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.hero-imgs{display:flex;height:150px}
.hero-imgs .h{flex:1;position:relative;overflow:hidden}
.hero-imgs img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
.hero-imgs .h::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(10,13,24,.88))}
.hero-cap{position:absolute;left:0;right:0;bottom:0;padding:16px 20px;z-index:2}
.hero-cap .t{font-size:20px;font-weight:800;letter-spacing:.05em}
.hero-cap .s{font-size:12.5px;color:var(--ink2);margin-top:2px}

.sec{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
.sec h2{font-size:16px;letter-spacing:.03em}
.sec .line{flex:1;height:1px;background:var(--line)}
.sec .n{font-size:12px;color:var(--ink3)}

.room-list{display:flex;flex-direction:column;gap:12px}
.room-card{
  display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);transition:.2s;
}
.room-card:hover{transform:translateY(-2px);border-color:rgba(227,180,92,.45);box-shadow:var(--shadow)}
.room-card .rname{font-weight:700;font-size:15.5px}
.room-card .meta{font-size:12px;color:var(--ink3);margin-top:2px;display:flex;gap:10px;align-items:center}
.room-card .lock{color:var(--gold);font-size:14px}
.room-card .arrow{margin-left:auto;color:var(--ink3);font-size:18px}
.pill{display:inline-flex;align-items:center;gap:4px;background:rgba(63,191,174,.12);color:var(--teal);font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid rgba(63,191,174,.3)}
.empty{
  text-align:center;padding:38px 20px;border:1px dashed var(--line);border-radius:var(--radius);
  color:var(--ink3);font-size:14px;background:rgba(22,28,48,.5);
}
.empty .big{font-size:30px;margin-bottom:8px}

.fab-wrap{margin-top:26px}
.fab{
  width:100%;padding:16px;border-radius:16px;border:1px dashed rgba(227,180,92,.5);
  background:rgba(227,180,92,.06);color:var(--gold2);font-size:15px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.fab:hover{background:rgba(227,180,92,.14);transform:translateY(-2px)}

/* ============ 房间 ============ */
.room-head{
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
  background:rgba(10,13,24,.85);border-bottom:1px solid var(--line);
}
.room-head-in{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:760px;margin:0 auto}
.room-head .rn{font-weight:750;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-head .sub{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.members{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;max-width:760px;margin:0 auto;scrollbar-width:none}
.members::-webkit-scrollbar{display:none}
.mchip{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;padding:4px 10px 4px 4px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:12px;
}
.mchip img{width:22px;height:22px;border-radius:50%;object-fit:cover;object-position:center 20%}
.mchip .crown{font-size:11px}
.chat{flex:1;overflow-y:auto;padding:18px 20px 8px;max-width:760px;width:100%;margin:0 auto}
.msg{display:flex;gap:10px;margin-bottom:14px;align-items:flex-end}
.msg .av{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:center 20%;flex:0 0 auto;border:1px solid var(--line)}
.msg .body{max-width:72%}
.msg .who{font-size:11.5px;color:var(--ink3);margin:0 4px 4px;display:flex;gap:6px;align-items:center}
.msg .bubble{
  padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);
  font-size:14.5px;word-break:break-word;box-shadow:0 2px 8px -4px rgba(0,0,0,.5);
}
.msg.self{flex-direction:row-reverse}
.msg.self .bubble{background:linear-gradient(180deg,#2a3352,#232b48);border-color:rgba(227,180,92,.35)}
.msg.self .who{justify-content:flex-end}
.msg.sys{justify-content:center;margin:10px 0}
.msg.sys .bubble{
  background:transparent;border:none;box-shadow:none;color:var(--gold);
  font-size:12px;padding:4px 10px;letter-spacing:.05em;
}
.composer{
  position:sticky;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,rgba(10,13,24,.9) 40%);
}
.composer-in{display:flex;gap:10px;max-width:760px;margin:0 auto}
.composer .input{flex:1}
.composer .btn{padding:12px 20px}

/* ============ 弹窗 / 提示 ============ */
.mask{
  position:fixed;inset:0;background:rgba(5,8,16,.72);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.mask.on{display:flex}
.modal{
  width:100%;max-width:380px;background:linear-gradient(180deg,#1c2440,#131830);
  border:1px solid var(--line);border-radius:20px;padding:26px 24px;box-shadow:var(--shadow);
}
.modal h3{font-size:17px;margin-bottom:6px}
.modal .muted{margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:6px;letter-spacing:.03em}
.modal .row{display:flex;gap:10px;margin-top:20px}
.modal .row .btn{flex:1}
#toast{
  position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);z-index:99;
  background:linear-gradient(180deg,#2a3352,#1d2440);border:1px solid rgba(227,180,92,.5);
  color:var(--gold2);padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--shadow);max-width:86vw;text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .msg .body{max-width:80%}
  .hero-imgs{height:120px}
  .bar .me .n{max-width:80px}
}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 入场 ============ -->
  <section class="view on" id="view-enter">
    <div class="enter-card">
      <div style="font-size:12px;letter-spacing:.35em;color:var(--gold);margin-bottom:18px">云 端 会 客 厅</div>
      <div class="avatar-big"><img id="myAvatar" src="assets/monkey.jpg" alt="化身"></div>
      <div class="id-name">化身为 · <span class="accent" id="myName">…</span></div>
      <div class="enter-actions">
        <button class="btn ghost" id="btnReroll">🔄 换个化身</button>
        <button class="btn gold" id="btnEnter">入 世</button>
      </div>
      <div class="enter-note">
        进入即领取<b style="color:var(--ink2)">临时身份</b>，关闭页面即消散。<br>
        房间凭<b style="color:var(--ink2)">口令</b>进出 · 房主离开，房间即刻散场 · 离房后再入，旧语皆忘。
      </div>
    </div>
  </section>

  <!-- ============ 大厅 ============ -->
  <section class="view" id="view-lobby">
    <header class="bar">
      <div class="bar-in">
        <span class="logo">云端会客厅<small>LOBBY</small></span>
        <span class="pill" id="connState">○ 连接中</span>
        <span class="spacer"></span>
        <div class="me">
          <img id="barAvatar" src="" alt="">
          <span class="n" id="barName"></span>
        </div>
        <button class="btn ghost" id="btnLogout" style="padding:8px 14px;font-size:13px">散去身份</button>
      </div>
    </header>
    <div class="wrap" style="flex:1;display:flex;flex-direction:column;padding-bottom:40px">
      <div class="hero">
        <div class="hero-imgs">
          <div class="h"><img src="assets/monkey.jpg" alt=""></div>
          <div class="h"><img src="assets/nezha.jpg" alt=""></div>
        </div>
        <div class="hero-cap">
          <div class="t">一念聚，一念散</div>
          <div class="s">房主离开即散场 · 离房再入，消息不留痕 · 此刻 <b id="lobbyCnt" style="color:var(--gold2)">0</b> 间会客厅亮着灯</div>
        </div>
      </div>

      <div class="sec"><h2>⌘ 现有会客厅</h2><span class="line"></span><span class="n" id="roomCnt">0 间</span></div>
      <div class="room-list" id="roomList"></div>

      <div class="fab-wrap">
        <button class="fab" id="btnOpenCreate">＋ 开辟一间新会客厅</button>
      </div>
      <div style="text-align:center;margin-top:18px">
        <a href="about/" style="color:var(--ink3);font-size:12px;text-decoration:none;letter-spacing:.08em">关于作者 ›</a>
      </div>
    </div>
  </section>

  <!-- ============ 房间 ============ -->
  <section class="view" id="view-room">
    <div class="room-head">
      <div class="room-head-in">
        <button class="btn ghost" id="btnLeave" style="padding:8px 13px;font-size:13px">← 离开</button>
        <div style="min-width:0">
          <div class="rn" id="roomName">…</div>
          <div class="sub" id="roomSub"></div>
        </div>
        <span class="spacer"></span>
        <span class="pill">🔒 口令房</span>
      </div>
      <div class="members" id="memberList"></div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="composer">
      <div class="composer-in">
        <input class="input" id="msgInput" maxlength="500" placeholder="说点什么…（Enter 发送）" autocomplete="off">
        <button class="btn gold" id="btnSend">发送</button>
      </div>
    </div>
  </section>
</div>

<!-- 建房弹窗 -->
<div class="mask" id="maskCreate">
  <div class="modal">
    <h3>开辟新会客厅</h3>
    <div class="muted">你将成为房主。你离开的那一刻，房间随之消散。</div>
    <div class="field">
      <label>房间名</label>
      <input class="input" id="createName" maxlength="16" placeholder="如：东海论剑">
    </div>
    <div class="field">
      <label>口令（4-20 位）</label>
      <input class="input" id="createPass" maxlength="20" placeholder="凭此口令进出" autocomplete="off">
    </div>
    <div class="row">
      <button class="btn ghost" id="btnCreateCancel">取消</button>
      <button class="btn gold" id="btnCreateOk">开辟</button>
    </div>
  </div>
</div>

<!-- 进房口令弹窗 -->
<div class="mask" id="maskJoin">
  <div class="modal">
    <h3>进入「<span id="joinRoomName"></span>」</h3>
    <div class="muted">此房间有口令护持</div>
    <div class="field">
      <label>口令</label>
      <input class="input" id="joinPass" maxlength="20" autocomplete="off">
    </div>
    <div class="row">
      <button class="btn ghost" id="btnJoinCancel">取消</button>
      <button class="btn gold" id="btnJoinOk">进入</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="vendor/mqtt.min.js"></script>
<script src="app.js"></script>
</body>
</html>
